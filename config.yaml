# Ustawienia scrapera. Filtry ofert (cena, metraż, pokoje, dzielnice)
# ustawiasz na stronie — tutaj tylko wstępne zawężenie tego, co w ogóle pobieramy.

# Miejscowości — każda dostaje własną listę ofert na stronie (wybór miasta
# w nagłówku pojawia się, gdy jest ich więcej niż jedna). Wpisz nazwę albo slug:
#   cities:
#     - wroclaw
#     - Kraków
#     - siechnice
#     - {name: "Radwanice", county: "wrocławski"}   # gdy nazwa jest niejednoznaczna
# Nową miejscowość scraper sam ustali w portalach przy najbliższym przebiegu
# (zapis w scraper/cities_cache.json) — można też od razu sprawdzić:
#   python -m scraper.cities add "Kraków"
cities:
  - wroclaw

# Typy ogłoszeń i wstępny filtr pobierania dla każdego z nich
# (zostaw puste = bez limitu). Szerokie widełki = więcej ofert na stronie.
# Ceny: sprzedaż = cena całkowita, wynajem/pokój = czynsz zł/mies.
deals:
  sprzedaz:              # kupno mieszkania
    enabled: true
    prefilter:
      price_min: 200000
      price_max: 1500000
      area_min: 20
  wynajem:               # wynajem mieszkania
    enabled: true
    prefilter:
      price_min: 1000
      price_max: 8000
      area_min: 15
  pokoj:                 # wynajem pokoju
    enabled: true
    prefilter:
      price_min: 300
      price_max: 3000

# Które portale włączone (true/false)
sources:
  otodom: true
  olx: true
  gratka: true
  morizon: false         # to samo co gratka (wspólna baza ogłoszeń)
  nieruchomosci_online: true
  domiporta: true

# Portale pobierane na komputerze zamiast w chmurze. OLX blokuje serwery GitHuba,
# więc pobiera go komputer właścicielki (co godzinę, gdy jest włączony i na zasilaczu —
# python -m scraper.feed install) i wysyła pliki feeds/olx/. Przebieg w chmurze czyta
# te pliki; starsze niż max_age_hours = OLX „nieaktualny” (stare oferty zostają bez zmian).
# on_battery: true — pobieraj także na baterii.
feeds:
  olx: {max_age_hours: 6, on_battery: false}

# Bezpiecznik: maks. liczba stron na portal w jednym przebiegu.
# Scrapery pobierają wszystko do końca wyników — limit tylko na wypadek błędu.
max_pages: 300

# Po ilu dniach od zniknięcia z portali oferta wypada z listy
drop_after_days: 14

# Otodom blokuje częste pobieranie, więc co przebieg bierzemy tylko
# najnowsze strony (osobno dla kupna, wynajmu i pokoi)...
otodom_max_pages: 8

# ...a jego oferty, których nie widzieliśmy, trzymamy na liście tyle dni
# od ostatniego zobaczenia (bo mogły być po prostu na dalszej stronie).
partial_sources:
  otodom: 30

# Gratka: przy kupnie pobieraj też szczegóły (piętro, stan, balkon, winda...).
# Daje dużo lepsze filtry, ale wydłuża przebieg o ok. 8 minut.
gratka_details: true
